[project]
name = "chorms"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ThomasHjorgensen", email = "tjo@econ.ku.dk" }
]
requires-python = ">=3.13"

[project.scripts]
chorms = "chorms:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "econmodel",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "scipy>=1.18.0",
]

[tool.uv.sources]
econmodel = { git = "https://github.com/NumEconCopenhagen/EconModel" }
